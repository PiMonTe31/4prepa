<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Autocuidado Diario</title> 

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Animate.css -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>
body {
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    text-align: center;
    font-family: Arial;
}

.container-box {
    margin-top: 100px;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
}

#mensaje {
    margin-top: 20px;
    font-size: 1.3em;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <div class="container-box animate__animated animate__fadeIn">
        <h2>💙 Momento de Autocuidado</h2>

        <button class="btn btn-primary mt-3" onclick="mostrarMensaje()">
            ¿Qué necesito hoy?
        </button>

        <div id="mensaje" class="mt-4 text-success"></div>
    </div>
</div>

<script>
const mensajes = [
    "Respira profundo y tómate un momento para ti 🌿",
    "Recuerda que estás haciendo lo mejor que puedes 💪",
    "Hoy es un buen día para empezar algo nuevo 🌞",
    "Descansa, tu mente también lo necesita 🧠",
    "Tómate un tiempo lejos de la pantalla 📵",
    "Valora tus logros, por pequeños que sean 🌟",
    "Habla contigo mismo con amabilidad 💙",
    "Un pequeño descanso puede cambiar tu día ☕",
    "Confía en ti, eres capaz de lograrlo 🚀",
    "Sonríe, estás avanzando 😊"
];

function mostrarMensaje() {
    const random = Math.floor(Math.random() * mensajes.length);
    const mensajeDiv = document.getElementById("mensaje");

    mensajeDiv.className = "mt-4 text-success animate__animated animate__bounce";
    mensajeDiv.innerText = mensajes[random];
}
</script>

</body>
</html>
